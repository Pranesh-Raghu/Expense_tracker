# Throwaway variant of render.yaml for validating the service wiring
# (fromService references, dockerCommand composition, static-site rewrites)
# on Render's free plan, with NO payment info required at all: unlike the
# first version of this file, there's no MySQL/OpenFGA private service -
# Render's free plan doesn't have private services (pserv) at any price
# point, only `web` services and static sites. So openfga runs as a plain
# (public) web service on SQLite, and the app also runs on SQLite instead
# of MySQL.
#
# NOT for real use: SQLite here lives on the container's ephemeral disk, so
# both the app's data and OpenFGA's authorization tuples are wiped on every
# restart/redeploy, and OpenFGA is reachable on the public internet instead
# of Render's private network. Delete this file (and the services it
# created) once the smoke test confirms the wiring works, and deploy
# render.yaml for anything real.

services:
  # Plain prebuilt image, not the openfga/Dockerfile wrapper render.yaml
  # uses: openfga/openfga is a shell-less/distroless-style image (no
  # /bin/sh), so a custom Dockerfile that COPYs + chmods + execs a shell
  # script fails at build time ("exec: /bin/sh: no such file"), and even
  # if it built, the script's #!/bin/sh shebang could never run anyway.
  # SQLite needs no MySQL-DSN composition, so there's nothing to wrap here.
  - name: expense-tracker-openfga-smoketest
    type: web
    runtime: image
    plan: free
    image:
      url: docker.io/openfga/openfga:latest
    envVars:
      - key: OPENFGA_DATASTORE_ENGINE
        value: sqlite
      - key: OPENFGA_DATASTORE_URI
        value: file:/tmp/openfga.db
      - key: OPENFGA_PLAYGROUND_ENABLED
        value: "false"
      - key: OPENFGA_LOG_FORMAT
        value: text
    # No preDeployCommand (unsupported on free plan) - run
    # `render jobs create <this-service-id> --start-command migrate` once
    # by hand after the first deploy instead.
    #
    # Explicit binary path: dockerCommand appears to replace the image's
    # own ENTRYPOINT rather than just override CMD the way docker-compose's
    # `command:` does - `dockerCommand: run` alone tries to exec a program
    # literally named "run", which fails silently (exit 128, no output)
    # before the Go binary can even log its startup banner.
    dockerCommand: /openfga run

  - name: expense-tracker-app-smoketest
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      # Render forces `type: web` services onto internal port 10000, which
      # is on Render's own blocked-ports list for private-network traffic
      # (https://render.com/docs/private-network) - so fromService
      # host/port doesn't actually work here the way it does for pserv in
      # render.yaml. Talk to openfga-smoketest over its public HTTPS URL
      # instead (fine functionally, just not private-network-only like a
      # real deployment). Same reasoning for CORS_ORIGINS below: the
      # `host` property is the *private* hostname (no .onrender.com
      # suffix), which won't match the browser's real Origin header.
      #
      # TODO: same chicken-and-egg caveat as the frontend's routes below -
      # these are only knowable after each service's first deploy.
      - key: OPENFGA_API_URL
        value: https://expense-tracker-openfga-smoketest.onrender.com
      - key: CORS_ORIGINS
        value: https://expense-tracker-frontend-smoketest.onrender.com
      - key: CIMD_ALLOW_INSECURE_HTTP
        value: "false"
      - key: INITIAL_ADMIN_USERNAMES
        value: ""
    # docker-entrypoint.sh (baked into the image) composes DATABASE_URL and
    # OAUTH_ISSUER; OPENFGA_API_URL/CORS_ORIGINS are set directly above so
    # its fallback composition for those two doesn't kick in.

  - name: expense-tracker-frontend-smoketest
    type: web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # TODO: fill in the real app-smoketest hostname once it exists -
      # Render assigns it on first deploy, so this can't be known upfront.
      - source: /auth/*
        destination: https://expense-tracker-app-smoketest.onrender.com/auth/*
        type: rewrite
      - source: /users/*
        destination: https://expense-tracker-app-smoketest.onrender.com/users/*
        type: rewrite
      - source: /expenses/*
        destination: https://expense-tracker-app-smoketest.onrender.com/expenses/*
        type: rewrite
      - source: /oauth/*
        destination: https://expense-tracker-app-smoketest.onrender.com/oauth/*
        type: rewrite
      - source: /.well-known/*
        destination: https://expense-tracker-app-smoketest.onrender.com/.well-known/*
        type: rewrite
      - source: /*
        destination: /index.html
        type: rewrite
