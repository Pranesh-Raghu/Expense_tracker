# Variant of render.yaml that avoids Render's payment-info gate entirely:
# no MySQL/OpenFGA private service (pserv requires payment info at any
# price point on Render), and no persistent disk (free-plan services don't
# support disks at all - `disks are not supported for free tier services`,
# confirmed via `render blueprints validate`).
#
# Both the app and OpenFGA instead point at a free external Postgres
# (e.g. https://neon.tech - no card required) for real persistence across
# redeploys. openfga runs as a plain (public) `type: web` service rather
# than a private one, so it's reachable over the public internet instead
# of Render's private network - a real (if minor) security difference
# from render.yaml, acceptable for a smoke test but not for production.
#
# TODO before this actually persists anything: sign up for a free Postgres
# (Neon, Supabase, etc.), then in each service's dashboard Environment
# tab set:
#   - expense-tracker-app-smoketest: DATABASE_URL to that Postgres URI
#   - expense-tracker-openfga-smoketest: OPENFGA_DATASTORE_URI to the
#     SAME Postgres URI (OpenFGA creates its own tables - `store`,
#     `tuple`, etc. - that won't collide with the app's `users`,
#     `expenses`, etc., so one database can serve both)

services:
  - name: expense-tracker-openfga-smoketest
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./openfga/Dockerfile
    dockerContext: ./openfga
    envVars:
      - key: OPENFGA_DATASTORE_ENGINE
        value: postgres
      # sync: false - paste the real Postgres connection string in this
      # service's dashboard Environment tab, not here (it's a credential).
      - key: OPENFGA_DATASTORE_URI
        sync: false
      - key: OPENFGA_PLAYGROUND_ENABLED
        value: "false"
      - key: OPENFGA_METRICS_ENABLED
        value: "false"
      - key: OPENFGA_LOG_FORMAT
        value: text
    # openfga/Dockerfile's baked-in CMD composes a MySQL DSN only when
    # MYSQL_HOST is set (render.yaml's case) - here it isn't, so the
    # engine/URI above are used as-is, then `migrate && exec run`.

  - name: expense-tracker-app-smoketest
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      # sync: false - paste the same Postgres connection string here too
      # (see the TODO above).
      - key: DATABASE_URL
        sync: false
      # Render forces `type: web` services onto internal port 10000, which
      # is on Render's own blocked-ports list for private-network traffic
      # (https://render.com/docs/private-network) - so fromService
      # host/port doesn't actually work here the way it does for pserv in
      # render.yaml. Talk to openfga-smoketest over its public HTTPS URL
      # instead (fine functionally, just not private-network-only like a
      # real deployment). Same reasoning for CORS_ORIGINS below: the
      # `host` property is the *private* hostname (no .onrender.com
      # suffix), which won't match the browser's real Origin header.
      #
      # TODO: same chicken-and-egg caveat as the frontend's routes below -
      # these are only knowable after each service's first deploy.
      - key: OPENFGA_API_URL
        value: https://expense-tracker-openfga-smoketest.onrender.com
      - key: CORS_ORIGINS
        value: https://expense-tracker-frontend-smoketest.onrender.com
      - key: CIMD_ALLOW_INSECURE_HTTP
        value: "false"
      - key: INITIAL_ADMIN_USERNAMES
        value: ""
      - key: FRONTEND_URL
        value: https://expense-tracker-frontend-smoketest.onrender.com
      # sync: false - set the real values in this service's dashboard
      # Environment tab, not here. Google OAuth client credentials, so they
      # don't belong in git even in a throwaway smoke-test blueprint. See
      # google_oauth.py and .env.example for the redirect URI to register.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
    # docker-entrypoint.sh (baked into the image) only falls back to
    # sqlite/composes from MYSQL_* when DATABASE_URL isn't already set -
    # since it's set directly above (once you fill in the real value),
    # that fallback never triggers here.

  - name: expense-tracker-frontend-smoketest
    type: web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # TODO: fill in the real app-smoketest hostname once it exists -
      # Render assigns it on first deploy, so this can't be known upfront.
      - source: /auth/*
        destination: https://expense-tracker-app-smoketest.onrender.com/auth/*
        type: rewrite
      - source: /users/*
        destination: https://expense-tracker-app-smoketest.onrender.com/users/*
        type: rewrite
      - source: /expenses/*
        destination: https://expense-tracker-app-smoketest.onrender.com/expenses/*
        type: rewrite
      - source: /oauth/*
        destination: https://expense-tracker-app-smoketest.onrender.com/oauth/*
        type: rewrite
      - source: /.well-known/*
        destination: https://expense-tracker-app-smoketest.onrender.com/.well-known/*
        type: rewrite
      - source: /*
        destination: /index.html
        type: rewrite
