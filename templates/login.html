<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign in - Pennywise</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f5f5f7; display: flex; justify-content: center; padding-top: 8vh; }
    .card { background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); width: 320px; }
    h1 { font-size: 1.1rem; margin-bottom: 0.25rem; }
    p.sub { color: #666; font-size: 0.85rem; margin-top: 0; margin-bottom: 1.5rem; }
    label { display: block; font-size: 0.85rem; margin-bottom: 0.25rem; color: #333; }
    input[type=text], input[type=password] { width: 100%; padding: 0.5rem; margin-bottom: 1rem; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
    .buttons { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    button { flex: 1; padding: 0.6rem; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
    .approve { background: #2563eb; color: #fff; }
    .deny { background: #eee; color: #333; }
    .error { color: #c0392b; font-size: 0.85rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sign in to Pennywise</h1>
    <p class="sub">"{{ client_name }}" is requesting access to your expense data{% if scope %} ({{ scope }}){% endif %}.</p>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <form method="post" action="/oauth/authorize">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required autofocus />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required />

      <input type="hidden" name="client_id" value="{{ client_id }}" />
      <input type="hidden" name="redirect_uri" value="{{ redirect_uri }}" />
      <input type="hidden" name="state" value="{{ state }}" />
      <input type="hidden" name="scope" value="{{ scope }}" />
      <input type="hidden" name="resource" value="{{ resource }}" />
      <input type="hidden" name="code_challenge" value="{{ code_challenge }}" />
      <input type="hidden" name="code_challenge_method" value="{{ code_challenge_method }}" />

      <div class="buttons">
        <button type="submit" name="decision" value="deny" class="deny">Deny</button>
        <button type="submit" name="decision" value="approve" class="approve">Sign in &amp; approve</button>
      </div>
    </form>
  </div>
</body>
</html>
