server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # API prefixes owned by the FastAPI app - see vite.config.ts for the dev
    # equivalent. APP_UPSTREAM is set at build/run time via envsubst or a
    # custom entrypoint; defaulting here to the compose service name.
    location ~ ^/(auth|users|expenses|oauth|\.well-known)/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}
