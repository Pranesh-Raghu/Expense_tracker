# Render Blueprint for the Expense Tracker. Deploys the same four services
# as docker-compose.yml (db, openfga, app, frontend) as native Render
# services instead of a single compose stack.
#
# Before running `render blueprint launch` / connecting this repo in the
# Render dashboard, read the TODO in the frontend service's routes below -
# the app service's real onrender.com hostname (or custom domain) only
# exists after its first deploy, so there's an unavoidable chicken-and-egg
# step: deploy once, then come back and fill in the real URL.
#
# Validated with `render blueprints validate ./render.yaml` (CLI v2.22.0).

envVarGroups:
  - name: expense-tracker-secrets
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true

services:
  # --- Database (private service, no public port) ---------------------
  - name: expense-tracker-db
    type: pserv
    runtime: docker
    plan: starter
    dockerfilePath: ./mysql/Dockerfile
    dockerContext: .
    envVars:
      - fromGroup: expense-tracker-secrets
      - key: MYSQL_DATABASE
        value: expensetracker
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10

  # --- OpenFGA (private service, no public port) -----------------------
  #
  # Plain prebuilt image: openfga/openfga is a shell-less/distroless-style
  # image (no /bin/sh), so a custom Dockerfile wrapping it in a shell
  # entrypoint script - which is what would normally compose
  # OPENFGA_DATASTORE_URI from the discrete MYSQL_* values below - fails at
  # build time ("exec: /bin/sh: no such file"), and the script's #!/bin/sh
  # shebang couldn't run even if it built.
  #
  # TODO: because of that, OPENFGA_DATASTORE_URI below is a placeholder.
  # After the first deploy, open expense-tracker-db in the dashboard to
  # read its actual host/port, open the expense-tracker-secrets env group
  # to read the generated MYSQL_ROOT_PASSWORD, and set this service's real
  # OPENFGA_DATASTORE_URI directly in the dashboard to:
  #   root:<MYSQL_ROOT_PASSWORD>@tcp(<db host>:<db port>)/openfga?parseTime=true
  - name: expense-tracker-openfga
    type: pserv
    runtime: image
    image:
      url: docker.io/openfga/openfga:latest
    envVars:
      - fromGroup: expense-tracker-secrets
      - key: MYSQL_HOST
        fromService:
          name: expense-tracker-db
          type: pserv
          property: host
      - key: MYSQL_PORT
        fromService:
          name: expense-tracker-db
          type: pserv
          property: port
      - key: OPENFGA_DATASTORE_URI
        value: "root:CHANGE_ME@tcp(CHANGE_ME:3306)/openfga?parseTime=true"
      - key: OPENFGA_DATASTORE_ENGINE
        value: mysql
      - key: OPENFGA_PLAYGROUND_ENABLED
        value: "false"
      - key: OPENFGA_METRICS_ENABLED
        value: "false"
      - key: OPENFGA_LOG_FORMAT
        value: text
    # Explicit binary path in both - see render.smoketest.yaml for why
    # (dockerCommand appears to replace ENTRYPOINT, not just CMD).
    preDeployCommand: /openfga migrate
    dockerCommand: /openfga run

  # --- FastAPI app (public web service) ---------------------------------
  - name: expense-tracker-app
    type: web
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - fromGroup: expense-tracker-secrets
      - key: MYSQL_HOST
        fromService:
          name: expense-tracker-db
          type: pserv
          property: host
      - key: MYSQL_PORT
        fromService:
          name: expense-tracker-db
          type: pserv
          property: port
      - key: OPENFGA_HOST
        fromService:
          name: expense-tracker-openfga
          type: pserv
          property: host
      - key: OPENFGA_PORT
        fromService:
          name: expense-tracker-openfga
          type: pserv
          property: port
      - key: FRONTEND_HOST
        fromService:
          name: expense-tracker-frontend
          type: web
          property: host
      - key: CIMD_ALLOW_INSECURE_HTTP
        value: "false"
      - key: INITIAL_ADMIN_USERNAMES
        value: ""
    # docker-entrypoint.sh (baked into the image) composes DATABASE_URL,
    # OAUTH_ISSUER, OPENFGA_API_URL, and CORS_ORIGINS from the discrete
    # values above before exec'ing uvicorn - no dockerCommand override
    # needed. (An earlier version tried inlining this as a `dockerCommand:
    # sh -c '...'` string, but Render wraps dockerCommand in its own shell
    # invocation and the embedded quotes collided with it.)

  # --- Frontend (static site, proxies API paths to the app) -------------
  - name: expense-tracker-frontend
    type: web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # API rewrites must come before the SPA catch-all - Render evaluates
      # routes in order. Same origin as the frontend, so no CORS round-trip
      # actually happens for these in production; CORS_ORIGINS on the app
      # is there for direct API access (curl, the OAuth/MCP flows) only.
      #
      # TODO: replace this literal URL once you know the app service's real
      # onrender.com hostname (or your custom domain) - it isn't knowable
      # until after the app service's first deploy.
      - source: /auth/*
        destination: https://expense-tracker-app.onrender.com/auth/*
        type: rewrite
      - source: /users/*
        destination: https://expense-tracker-app.onrender.com/users/*
        type: rewrite
      - source: /expenses/*
        destination: https://expense-tracker-app.onrender.com/expenses/*
        type: rewrite
      - source: /oauth/*
        destination: https://expense-tracker-app.onrender.com/oauth/*
        type: rewrite
      - source: /.well-known/*
        destination: https://expense-tracker-app.onrender.com/.well-known/*
        type: rewrite
      - source: /*
        destination: /index.html
        type: rewrite
